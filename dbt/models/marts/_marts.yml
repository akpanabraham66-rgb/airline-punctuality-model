version: 2

models:
  - name: dim_carrier
    description: One row per airline that operated flights in the data, with its name.
    columns:
      - name: carrier_code
        description: Two-character BTS code of the airline that operated the flight.
        data_tests:
          - unique     # the grain: one row per airline
          - not_null
      - name: carrier_name
        description: Airline name, typed from the session 5 table.
        data_tests:
          - not_null

  - name: dim_airport
    description: >
      One row per airport code that appears as an origin or destination in the data.
      Codes only: the downloaded BTS columns don't include airport names.
    columns:
      - name: airport_code
        description: Three-letter airport code, for example ATL.
        data_tests:
          - unique     # the grain: one row per airport
          - not_null

  - name: dim_date
    description: One row per date, June to August 2025, with calendar columns for slicing.
    columns:
      - name: flight_date
        description: The date. Joins to fct_flights.flight_date.
        data_tests:
          - unique     # the grain: one row per date
          - not_null
      - name: weekday_number
        description: ISO weekday, 1 = Monday to 7 = Sunday.
      - name: is_weekend
        description: True on Saturday and Sunday.

  - name: fct_flights
    description: >
      One row per scheduled flight, June to August 2025. The centre of the star schema:
      measurements and flags, plus codes that join to dim_carrier, dim_airport and dim_date.
    columns:
      - name: flight_key
        description: Date, airline, flight number and origin joined with hyphens.
        data_tests:
          # Acceptance criterion 2: the flight key is unique.
          - unique
          - not_null
      - name: carrier_code
        description: Airline code. Joins to dim_carrier.
        data_tests:
          # Acceptance criterion 5 (airline half): every airline exists in dim_carrier.
          - relationships:
              arguments:
                to: ref('dim_carrier')
                field: carrier_code
      - name: origin_airport
        description: Departure airport code. Joins to dim_airport.
        data_tests:
          # Acceptance criterion 5 (airport half): every origin exists in dim_airport.
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_code
      - name: dest_airport
        description: Arrival airport code. Joins to dim_airport.
        data_tests:
          # Acceptance criterion 5 (airport half): every destination exists in dim_airport.
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_code
      - name: flight_date
        description: Flight date. Joins to dim_date.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: flight_date

  - name: mart_daily_punctuality
    description: >
      Counts for A15, D15 and the cancellation rate, one row per date, airline and
      departure airport. Percentages are calculated from these counts in Power BI.
    columns:
      - name: scheduled_flights
        description: All scheduled flights. The cancellation-rate denominator.
      - name: cancelled_flights
        description: Cancelled flights. The cancellation-rate numerator.
      - name: departed_flights
        description: Flights that were not cancelled, including diverted ones. The D15 denominator.
      - name: departed_on_time_flights
        description: Departed flights that left less than 15 minutes late. The D15 numerator.
      - name: operated_flights
        description: Flights that were not cancelled or diverted. The A15 denominator.
      - name: on_time_flights
        description: Operated flights arriving less than 15 minutes late. The A15 numerator.

  - name: mart_delay_causes
    description: >
      Delay minutes by BTS cause for operated flights arriving 15 or more minutes late,
      one row per date, airline and departure airport.
    columns:
      - name: delayed_flights
        description: Operated flights arriving 15 or more minutes late.
      - name: late_aircraft_minutes
        description: Reactionary delay minutes (BTS LateAircraftDelay). The reactionary-share numerator.
      - name: total_cause_minutes
        description: Sum of the five cause columns. The reactionary-share denominator.
